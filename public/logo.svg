<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
	<defs>
		<!-- Shadow effect -->
		<filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
			<feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
		</filter>

		<!-- Dark background gradient -->
		<linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" stop-color="#2a2d32"/>
			<stop offset="100%" stop-color="#181a1d"/>
		</linearGradient>
	</defs>

	<!-- Container Box -->
	<rect x="32" y="32" width="448" height="448" rx="88" fill="url(#bgGrad)" filter="url(#shadow)"/>
	<rect x="32" y="32" width="448" height="448" rx="88" fill="none" stroke="#3a3d45" stroke-width="2" opacity="0.6"/>

	<!-- Logo Group with Slant Effect -->
	<g transform="translate(12, 10) skewX(-10)">
		<!-- Letter 'J' - Green -->
		<g id="letter-J" fill="#00E65B">
			<path d="M 68 180 L 148 180 L 148 216 L 118 216 L 118 288 C 118 312 100 332 72 332 C 45 332 28 312 28 288 L 60 288 C 60 298 65 304 72 304 C 81 304 88 296 88 283 L 88 216 L 68 216 Z"/>
			<path d="M 60 180 L 90 180 L 60 216 Z" opacity="0.95"/>
		</g>

		<!-- Letter 'a' - Yellow -->
		<g id="letter-a1" fill="#FFDD00">
			<path d="M 160 220 C 160 192 182 172 216 172 C 248 172 266 190 266 218 L 266 330 L 236 330 L 236 304 C 225 322 208 332 186 332 C 160 332 144 314 144 290 C 144 263 166 247 202 245 L 236 243 L 236 228 C 236 209 224 198 206 198 C 190 198 180 207 178 220 Z M 236 268 L 204 270 C 188 271 176 278 176 290 C 176 301 186 308 198 308 C 216 308 236 294 236 274 Z"/>
		</g>

		<!-- Letter 'r' - Red -->
		<g id="letter-r" fill="#FF3B30">
			<path d="M 282 176 L 314 176 L 314 212 C 324 187 344 174 370 176 L 370 210 C 342 206 314 220 314 254 L 314 330 L 282 330 Z"/>
		</g>

		<!-- Letter 'a' - Blue -->
		<g id="letter-a2" fill="#0099FF">
			<path d="M 360 220 C 360 192 382 172 416 172 C 448 172 466 190 466 218 L 466 330 L 436 330 L 436 304 C 425 322 408 332 386 332 C 360 332 344 314 344 290 C 344 263 366 247 402 245 L 436 243 L 436 228 C 436 209 424 198 406 198 C 390 198 380 207 378 220 Z M 436 268 L 404 270 C 388 271 376 278 376 290 C 376 301 386 308 398 308 C 416 308 436 294 436 274 Z"/>
		</g>
	</g>
</svg>